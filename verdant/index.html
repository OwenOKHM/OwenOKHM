function* evaluate(e,env){switch(e[0]){case "lit":return e[1];case "var":return env.get(e[1]);case "list":{let a=[];for(let x of e[1])a.push(yield*evaluate(x,env));return a}case "idx":{let a=yield*evaluate(e[1],env),i=yield*evaluate(e[2],env);if(!Array.isArray(a)&&typeof a!=="string")throw Error("索引需要串列");if(!Number.isInteger(i)||i>=a.length||i< -a.length)throw Error("索引超出範圍");return a[i<0?a.length+i:i]}case "un":{let v=yield*evaluate(e[2],env);return e[1]==="not"?!v:e[1]==="-"?-v:+v}case "bin":{let a=yield*evaluate(e[2],env);if(e[1]==="and")return a?yield*evaluate(e[3],env):a;if(e[1]==="or")return a?a:yield*evaluate(e[3],env);return bin(e[1],a,yield*evaluate(e[3],env))}case "call":{let f=yield*evaluate(e[1],env),args=[];for(let a of e[2])args.push(yield*evaluate(a,env));if(f?.builtin){let v=api[f.builtin](...args);if(["move","plant","till","water","harvest","swap","wait","fertilize","start_maze","start_snake","finish_challenge"].includes(f.builtin)){state.ops++;yield {action:f.builtin,line:currentLine}}return v}if(f?.fn){if(args.length!==f.args.length)throw Error("函式參數數量錯誤");if(depth>=40)throw Error("函式遞迴太深");let inner=new Env(f.env);f.args.forEach((a,i)=>inner.set(a,args[i]));depth++;try{let result=yield*execute(f.body,inner);return result?.ret??null}finally{depth--}}throw Error("不可呼叫此值")}}}
function* execute(nodes,env){for(let n of nodes){currentLine=n.n;yield{line:n.n};switch(n.k){case "expr":yield*evaluate(n.e,env);break;case "assign":{let v=yield*evaluate(n.e,env);env.set(n.v,n.op==="="?v:bin(n.op[0],env.get(n.v),v));break}case "setidx":{let a=env.get(n.v),i=yield*evaluate(n.idx,env);if(!Array.isArray(a)||!Number.isInteger(i)||i<0||i>=a.length)throw Error("無效串列索引");a[i]=yield*evaluate(n.e,env);break}case "if":{let body=n.other;for(let [e,b] of n.branches)if(yield*evaluate(e,env)){body=b;break}let v=yield*execute(body,env);if(v!==undefined)return v;break}case "while":{while(yield*evaluate(n.e,env)){yield{line:n.n};let v=yield*execute(n.body,env);if(v===BR)break;if(v===CO)continue;if(v!==undefined)return v}break}case "for":{let a=yield*evaluate(n.e,env);if(!Array.isArray(a)&&typeof a!=="string")throw Error("for 需要 range 或串列");for(let x of a){env.set(n.v,x);yield{line:n.n};let v=yield*execute(n.body,env);if(v===BR)break;if(v===CO)continue;if(v!==undefined)return v}break}case "def":env.set(n.v,{fn:true,args:n.args,body:n.body,env});break;case "return":return{ret:yield*evaluate(n.e,env)};case "break":return BR;case "continue":return CO;case "pass":break}}}
function checkExpr(e){if(!e)return;let k=e[0];if(k==="bin"||k==="un")requireTech("ops");if(k==="list"||k==="idx")requireTech("lists");if(k==="bin"){checkExpr(e[2]);checkExpr(e[3])}else if(k==="un")checkExpr(e[2]);else if(k==="list")e[1].forEach(checkExpr);else if(k==="idx"){checkExpr(e[1]);checkExpr(e[2])}else if(k==="call"){checkExpr(e[1]);e[2].forEach(checkExpr)}}
function checkProgram(ns){for(let n of ns){if(n.k==="while"||n.k==="break"||n.k==="continue")requireTech("loops");if(n.k==="for")requireTech("ops");if(n.k==="assign")requireTech("variables");if(n.k==="def"||n.k==="return")requireTech("functions");if(n.k==="setidx")requireTech("lists");if(n.k==="if")requireTech("senses");checkExpr(n.e);if(n.idx)checkExpr(n.idx);if(n.body)checkProgram(n.body);if(n.branches)for(let [e,b] of n.branches){checkExpr(e);checkProgram(b)}if(n.other)checkProgram(n.other)}}
function prepare(code){depth=0;currentLine=0;let a=parse(code);checkProgram(a);return execute(a,new Env())}
function start(){try{vm=prepare($("code").value);running=true;log("[執行] 程式已啟動。");notice("無人機執行中");$("run").textContent="▶ 執行中";dirty=true}catch(e){log(e.message,true);running=false;vm=null}}
function stop(msg="已停止"){running=false;vm=null;$("run").textContent="▶ 執行";notice(msg);dirty=true}
function stepVM(){if(!vm)return false;try{let n=0;while(n++<250){let r=vm.next();if(r.done){stop("程式執行完畢");log("[完成]");return false}if(r.value?.action){$("execInfo").textContent="main.py · L"+r.value.line+" · "+r.value.action;return true}}return true}catch(e){log("第 "+currentLine+" 行："+e.message,true);stop("程式發生錯誤");return false}}
