.controls button#playAction:disabled{background:#526166;color:#b3c2c4}

<section class="home" id="home"><div class="hero-layout"><div><div class="eyebrow">CLASSIC STRATEGY CARD GAME</div><h1>三國烽局</h1><p class="sub">辨忠奸，運謀略，決勝於牌局。25名經典武將、完整標準＋軍爭牌庫，單機 AI 與好友房間。</p><div class="config"><div class="full modes" id="modes"></div><label>身份場人數<select id="count"></select></label><label>牌庫<select id="pack"><option value="war">標準＋軍爭・160張</option><option value="standard">標準・108張</option></select></label><button class="primary full" id="solo">開始單機對局</button><button class="ghost full" id="training">新手教學戰</button><div class="room"><div class="roomrow"><button id="host">建立好友房</button><input id="roomCode" maxlength="18" placeholder="輸入房間碼"><button id="join">加入</button></div><div id="netstatus" class="status" aria-live="polite"></div><div class="roomrow" id="roomActions" hidden><button id="copyRoom">複製房間碼</button><button id="startRoom" class="primary">開始・空位由 AI 補上</button><button id="closeRoom" class="ghost">離開房間</button></div></div></div></div><div class="hero-art" id="heroArt"></div></div><div class="homefooter"><span>原創美術及網頁程式・非官方作品</span><span>4–10人身份場 · 2V2 · 3V3 · 幻化（經典將池）</span><span>觸控／滑鼠操作</span></div></section>

function battleGeometry(n,w,h,portrait=false){

  }
  const sides=n>=8?2:n>=4?1:0,topCount=n-2*sides;

  const sw=Math.max(76,Math.min(146,maxByTop,maxBySides));
  const sh=Math.max(84,Math.min(118,Math.floor(h*.28)));

  for(let j=0;j<topCount;j++)positions.push([(w-topCount*(sw+gap)+gap)/2+sw/2+j*(sw+gap),topY]);
  for(let j=0;j<sides;j++)positions.push([w-gap-sw/2,sideY(j)]);

  const stageWidth=Math.min(430,w-2*inset);
  const stageTop=sh+2*gap;
  const stageHeight=Math.max(80,Math.min(148,h-stageTop-gap));
  return {positions,sw,sh,stage:{left:(w-stageWidth)/2,top:stageTop,width:stageWidth,height:stageHeight},required:h,available:h-stageTop-gap};
}

function showHero(p){if(!p||p.g<0)return;let g=G[p.g];showInfo(g[0],`<div style="display:flex;gap:18px;align-items:flex-start"><img src="${hero(p.g)}" style="width:min(38%,220px);border:1px solid #a58a58;border-radius:7px" alt="${g[0]}"><div><h3 style="color:${factionColor(g[1])}">${g[1]} · ${g[2]}基礎體力</h3><p style="margin:10px 0">${esc(g[3])}</p>${p.extra?.length?'<p>習得：'+p.extra.map(i=>esc(G[i][0]+'：'+G[i][3])).join('<br>')+'</p>':''}<h3>裝備與判定區</h3>${[...Object.values(p.eq||{}),...(p.delay||[]).map(d=>d.id)].map(id=>`<button class="equipinfo" data-equipinfo="${id}"><img src="${img(idc(id).name)}" alt=""><div><strong>${esc(idc(id).name)}</strong><p>${esc(C[idc(id).name].desc)}</p></div></button>`).join('')||'<p>無裝備及判定牌</p>'}</div></div>`);$('infoBody').querySelectorAll('[data-equipinfo]').forEach(b=>b.onclick=()=>showCard(+b.dataset.equipinfo))}
function showCard(id,override=null){let c=idc(id);if(!c)return;let n=override||c.name;showInfo(n,`<div style="display:flex;gap:18px;align-items:center">${cardHTML(id,'','',n)}<div><h3>${esc(C[n].type)} · ${c.suit}${ranks[c.rank-1]}</h3><p>${esc(C[n].desc)}</p>${n!==c.name?'<p>轉化材料：'+esc(c.name)+'</p>':''}</div></div>`)}
$('battleSettings').onclick=()=>{showInfo('對戰設定',`<div class="settingsrow">AI 停留時間 <select id="aiSpeed">${[[340,'快速 0.34秒'],[680,'正常 0.68秒'],[1100,'慢速 1.1秒'],[1600,'觀察 1.6秒']].map(([v,n])=>`<option value="${v}" ${v===battleSpeed?'selected':''}>${n}</option>`).join('')}</select></div><div class="settingsrow"><label><input type="checkbox" id="fullNull" ${fullNull?'checked':''}> 顯示全部合法無懈可擊提示</label><p>預設略過自己未被反制的有害錦囊及自己受益的錦囊。反制敵方無懈可擊仍保留。好友房由房主設定。</p></div>`);function save(){battleSpeed=+$('aiSpeed').value;fullNull=$('fullNull').checked;if(engine){engine.speed=battleSpeed;engine.config.fullNull=fullNull}try{localStorage.setItem('kingdom-settings',JSON.stringify({speed:battleSpeed,fullNull}))}catch(_){}}$('aiSpeed').onchange=save;$('fullNull').onchange=save};let libraryMode='hero',libFilter='';function renderLibrary(){let items=libraryMode==='hero'?G.map((g,i)=>({key:g[0],html:`<div class="libitem"><img src="${hero(i)}" alt=""><strong style="color:${factionColor(g[1])}">${g[0]} · ${g[1]} ${g[2]}</strong><p>${esc(g[3])}</p></div>`,search:g.join(' ')})):Object.keys(C).map(n=>{let cards=ALL.filter(c=>c.name===n);return {key:n,html:`<div class="libitem">${cardHTML(cards[0].id)}<strong>${n} · ${cards.length}張</strong><p>${esc(C[n].desc)}</p><small>${cards.map(c=>c.suit+ranks[c.rank-1]).join(' ')}</small></div>`,search:n+C[n].type+C[n].desc}});$('libList').innerHTML=items.filter(x=>x.search.toLowerCase().includes(libFilter.toLowerCase())).map(x=>x.html).join('')||'<p>沒有符合項目</p>'}
$('galleryBtn').onclick=()=>{libFilter='';showInfo('武將與卡牌圖鑑',`<div class="filters"><button id="libH">25名武將</button><button id="libC">43種・160張牌</button><input id="libSearch" placeholder="搜尋名稱、勢力或技能"></div><div class="library" id="libList" style="margin-top:10px"></div>`);$('libH').onclick=()=>{libraryMode='hero';renderLibrary()};$('libC').onclick=()=>{libraryMode='card';renderLibrary()};$('libSearch').oninput=e=>{libFilter=e.target.value;renderLibrary()};renderLibrary()};
$('rulesBtn').onclick=()=>showInfo('遊戲規則',`<div class="role-list">${ROLES.map(r=>`<div><img src="${art[r]||art.battle}" alt=""><strong>${r}</strong><p>${roleGoal(r)}</p></div>`).join('')}</div><div class="rules" style="margin-top:12px"><div class="rulebox"><h3>回合與手牌</h3><p>準備 → 判定 → 摸兩張 → 出牌 → 棄牌 → 結束。起始四張牌，主公在五人以上額外一點體力。手牌上限通常為目前體力。</p></div><div class="rulebox"><h3>攻擊及響應</h3><p>通常每個出牌階段限一次殺。閃抵消殺；決鬥輪流打出殺；無懈可擊可抵消錦囊並被反制。桃可回復體力，瀕死時其他人可救援。</p></div><div class="rulebox"><h3>裝備與距離</h3><p>距離按存活座位環形最短路計算；武器改變攻擊範圍，坐騎調整距離。武器、防具、兩種坐騎各有一個裝備位置。</p></div><div class="rulebox"><h3>判定、屬性與連環</h3><p>判定翻牌並檢查花色點數。火、雷屬性傷害可經連環傳遞，解除連環。閃電、樂不思蜀、兵糧寸斷在判定階段結算。</p></div><div class="rulebox"><h3>身份場</h3><p>只有主公公開；其餘身份依行為推斷。擊殺反賊摸三張，主公殺忠臣須棄手牌及裝備。支援4至10人。</p></div><div class="rulebox"><h3>其他模式</h3><p>2V2及3V3使用經典將池、明示隊伍、消滅對方取勝。幻化為8人自由混戰，可用靈力換牌、治療、習得經典武將技能組；此為本作簡化規則。</p></div><div class="rulebox"><h3>觸控操作</h3><p>可用手牌有金邊，點選後按使用。需要目標、棄牌或響應時選取項目並確認。點武將查看技能，點不可用牌查看說明。</p></div><div class="rulebox"><h3>好友房</h3><p>建立房間後分享房間碼；空位由AI補上。房主進行規則判定。網絡連線依賴 WebRTC 及外部訊號服務，斷線時由AI接管。</p></div></div>`);
$('mechanicsBtn').onclick=()=>{let list=[['judge','判定','翻牌、花色、點數及最終結果'],['pindian','拼點','雙方秘密選牌，公開比較點數'],['chain','連環','火雷傷害傳導及解除'],['flip','翻面','背面狀態與跳過回合'],['recast','重鑄','棄牌並摸一張'],['convert','視為使用','原材料與實際卡牌效果'],['hpLoss','體力流失','不視為受到傷害'],['extra','額外回合','安排額外回合'],['mark','特殊標記','可見的數量及狀態']];showInfo('機制手冊／獨立練習','<p>練習使用獨立規則引擎，不影響正在進行的對局。拼點、翻面及額外回合沒有加入經典武將的新技能。</p><div class="mechanicLab">'+list.map(([k,n,d])=>'<button data-drill="'+k+'">'+n+'<small>'+d+'</small></button>').join('')+'</div><div id="labOutput" class="labOutput">選擇一項機制開始示範。</div>');$('infoBody').querySelectorAll('[data-drill]').forEach(b=>b.onclick=()=>runDrill(b.dataset.drill))};
let drillToken=0;
async function runDrill(kind){let token=++drillToken,lab=new Engine({mode:'duo',humans:[],fast:true},null,null);let [a,b,c,d]=lab.players;[a,b,c,d].forEach((p,i)=>{p.g=[7,9,11,17][i];p.hp=p.max=4});lab.turn=0;lab.phase='出牌';let find=(name,suit,rank)=>ALL.find(c=>c.name===name&&(!suit||c.suit===suit)&&(!rank||c.rank===rank))?.id;let use=id=>{lab.deck=lab.deck.filter(x=>x!==id);return id};try{if(kind==='judge'){let id=use(find('殺','♠',7));lab.deck.push(id);await lab.judge(b,'閃電')}else if(kind==='pindian'){a.hand=[use(find('殺','♥',10))];b.hand=[use(find('桃','♥',3))];await lab.pindian(a,b)}else if(kind==='chain'){b.chain=c.chain=true;await lab.damage(b,1,a,{name:'火殺',ids:[]},'fire')}else if(kind==='flip'){await lab.flip(b,a);await lab.oneTurn(b)}else if(kind==='recast'){let id=use(find('鐵索連環'));a.hand=[id];await lab.playCard(a,{name:'鐵索連環',ids:[id]},[])}else if(kind==='convert'){a.g=8;let id=use(find('桃'));a.hand=[id];await lab.playCard(a,{name:'殺',ids:[id],skill:'武聖'},[b])}else if(kind==='hpLoss'){await lab.loseHP(a,1)}else if(kind==='extra'){await lab.queueExtra(a);let id=lab.extraTurns.shift();lab.extraActive=true;await lab.oneTurn(lab.p(id));lab.extraActive=false}else if(kind==='mark'){await lab.setMark(a,'練習標記',2);await lab.setMark(a,'練習標記',1)}if(token!==drillToken||!$('labOutput'))return;let v=lab.view(0);$('labOutput').innerHTML=lab.mechanics.map(e=>'<div class="mechHistoryItem">'+mechanismHTML(e,v)+'</div>').join('')+'<p>練習結果：'+lab.players.map(p=>esc(lab.name(p))+' '+p.hp+'/'+p.max+' 體力').join(' · ')+'</p>'}catch(e){if($('labOutput'))$('labOutput').textContent='練習錯誤：'+e.message}}
$('logBtn').onclick=()=>showInfo('戰報',`<div class="loglist">${(view?.logs||[]).map(x=>`<div>${esc(x)}</div>`).join('')}</div>`);
function showResult(v){let win=v.winners.includes(localId);$('resultTitle').textContent=v.winners.length?(win?'勝利 · 烽火已定':'戰局結束 · 惜敗'):'平局';$('resultBody').innerHTML=v.players.map(p=>`<div class="resultitem ${v.winners.includes(p.id)?'win':''}"><img src="${hero(p.g)}" alt=""><b>${esc(hname(p))}</b><br><span style="color:${roleColor(p.role)}">${esc(p.role)}</span> ${p.dead?'陣亡':'存活'}<br>傷害 ${p.damage} · 擊殺 ${p.kills}<br>回復 ${p.heal}</div>`).join('');$('resultModal').hidden=false} $('resultClose').onclick=()=>$('resultModal').hidden=true;$('again').onclick=()=>showHome(true);$('homeBtn').onclick=()=>showHome();
// Online: only the host runs the engine; opponents' private cards and identities are redacted by view().
function netmsg(s){$('netstatus').textContent=s}function loadPeer(){if(window.Peer)return Promise.resolve(window.Peer);return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';s.onload=()=>window.Peer?resolve(window.Peer):reject(Error('PeerJS 未載入'));s.onerror=()=>reject(Error('連線服務無法載入'));document.head.append(s)})}
function updateRoomStatus(){if(role!=='host'||!room)return;let count=currentConfig().n;netmsg('房間碼：'+room+' · '+(hostConnections.size+1)+' 位真人／'+count+' 位玩家');$('roomActions').hidden=false;$('startRoom').disabled=hostConnections.size>=count}
function closeNetworking(){netToken++;for(let p of onlinePending.values()){clearTimeout(p.timer);p.resolve([])}onlinePending.clear();for(let c of hostConnections.values())try{c.close()}catch(_){}hostConnections.clear();if(guest)try{guest.close()}catch(_){}guest=null;if(peer)try{peer.destroy()}catch(_){}peer=null;room=null;roomStarted=false;role='solo';$('roomActions').hidden=true;$('solo').disabled=false;$('training').disabled=false;netmsg('')}
$('host').onclick=async()=>{closeNetworking();let token=++netToken;role='host';netmsg('正在建立連線房間…');try{let Peer=await loadPeer();if(token!==netToken)return;room=Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer('kingdom-gl-'+room,{debug:0});peer.on('open',()=>{if(token!==netToken)return;updateRoomStatus();$('solo').disabled=true;$('training').disabled=true});peer.on('error',err=>{if(token===netToken)netmsg('建立房間失敗：'+err.type)});peer.on('connection',c=>{c.on('open',()=>{if(token!==netToken)return;if(roomStarted){c.send({type:'reject',msg:'對局已開始'});c.close();return}let n=currentConfig().n,id=range(n).find(i=>i>0&&!hostConnections.has(i));if(id===undefined){c.send({type:'reject',msg:'房間已滿'});c.close();return}hostConnections.set(id,c);c.send({type:'welcome',id,room});updateRoomStatus();c.on('data',d=>{if(!d||d.type!=='choice'||!Array.isArray(d.ids)||d.ids.length>160)return;let p=onlinePending.get(id);if(p&&p.id===d.id){clearTimeout(p.timer);onlinePending.delete(id);p.resolve(d.ids.map(String))}});c.on('close',()=>{hostConnections.delete(id);if(engine?.players[id])engine.players[id].bot=true;let p=onlinePending.get(id);if(p){clearTimeout(p.timer);onlinePending.delete(id);p.resolve(engine.ai(engine.p(id),p.q))}updateRoomStatus()})})})}catch(e){if(token===netToken)netmsg('無法建立房間：'+e.message)}};
$('startRoom').onclick=()=>{if(role!=='host'||roomStarted)return;let cfg=currentConfig();if([...hostConnections.keys()].some(i=>i>=cfg.n)){netmsg('玩家數少於已分配座位，請增加人數或重新建房。');return}cfg.humans=[0,...hostConnections.keys()];roomStarted=true;localId=0;for(let c of hostConnections.values())c.send({type:'start'});startMatch(cfg)};
$('copyRoom').onclick=async()=>{if(!room)return;try{await navigator.clipboard.writeText(room);toast('已複製房間碼')}catch(_){toast('房間碼：'+room)}};$('closeRoom').onclick=closeNetworking;
$('join').onclick=async()=>{let code=$('roomCode').value.trim().toUpperCase();if(!/^[A-Z0-9]{4,12}$/.test(code)){netmsg('請輸入有效房間碼');return}closeNetworking();let token=++netToken;role='guest';netmsg('正在加入 '+code+'…');try{let Peer=await loadPeer();if(token!==netToken)return;peer=new Peer(undefined,{debug:0});peer.on('open',()=>{if(token!==netToken)return;guest=peer.connect('kingdom-gl-'+code,{reliable:true});guest.on('data',d=>{if(!d||token!==netToken)return;if(d.type==='welcome'){localId=d.id;room=d.room;netmsg('已加入房間 '+room+'，等待房主開始');$('solo').disabled=true;$('training').disabled=true;$('roomActions').hidden=false;$('startRoom').hidden=true}else if(d.type==='reject'){netmsg(d.msg)}else if(d.type==='start'){roomStarted=true;goGame()}else if(d.type==='state'){if($('game').hidden)goGame();render(d.view)}else if(d.type==='prompt'){acceptPrompt(d.q)}else if(d.type==='expired'&&activePrompt?.id===d.id){activePrompt=null;selected.clear();$('promptModal').hidden=true;toast('選擇逾時，由AI代為操作');if(view)render(view)}});guest.on('close',()=>{if(token!==netToken)return;netmsg('房主已離線');toast('房主已離線，請返回大廳');activePrompt=null;$('promptModal').hidden=true;if(view)render(view)});guest.on('error',()=>netmsg('無法連線到房間'))});peer.on('error',e=>{if(token===netToken)netmsg('連線失敗：'+e.type)})}catch(e){if(token===netToken)netmsg('無法加入房間：'+e.message)}};
// Keep the host-only control visible after leaving a guest room.
const oldClose=closeNetworking;closeNetworking=function(){oldClose();$('startRoom').hidden=false};
window.addEventListener('beforeunload',()=>{if(peer)peer.destroy()});
window.KingdomDebug={Engine,G,C,ALL,startMatch,get engine(){return engine},get view(){return view},get prompt(){return activePrompt}};
</script></body></html>
