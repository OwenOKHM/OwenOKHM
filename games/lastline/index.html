</style></head><body><main><header><div><h1>LASTLINE / 最後防線</h1><small>生存・自動化・基地防禦</small></div><span id="phase"></span></header><section><div id="stats"></div><div id="bar"><i></i></div><div id="mapbox"><canvas id="map" width="760" height="600"></canvas></div><div id="notice"></div><div id="result" hidden></div></section><aside><div class="row"><button id="run" class="primary">▶ 開始</button><button id="speed">×1</button><button id="gun">射擊 ✓</button></div><div id="tools"></div><div class="row"><button id="dir">方向 →</button><button id="zoom">縮放 100%</button></div><div id="detail"></div><div class="row"><button id="save">儲存</button><button id="load">讀檔</button><button id="reset">重開</button></div><small>先在兩個黃色虛線格建造向右輸送帶。礦石可運入基地兌換廢料。點擊廢墟可移動搜刮。藍灰色＝鐵礦，金色＝廢墟，綠色＝玩家。縮放後可在地圖空白處拖動捲動。</small></aside></main><script>

const key='lastline-save-v1',idx=(x,y)=>y*W+x,xy=i=>[i%W,Math.floor(i/W)],inside=(x,y)=>x>=0&&y>=0&&x<W&&y<H,at=(x,y)=>inside(x,y)?S.b[idx(x,y)]:null,near=(x,y,a,b)=>Math.hypot(x-a,y-b);

function init(){S={version:1,c:Array.from({length:W*H},()=>({t:'ground',r:Math.random()})),b:Array(W*H).fill(null),seen:Array(W*H).fill(false),p:{x:9,y:9,hp:100,path:[],cool:0},e:[],scrap:42,ammo:18,day:1,night:false,time:70,spawn:0,spawnClock:0,side:0,kills:0,made:0,ore:0,gun:true,dead:false,elapsed:0};for(const [x,y]of [[5,5],[13,9],[3,11],[15,3],[2,3],[16,12]])S.c[idx(x,y)].t='ore';for(const [x,y,v]of [[4,8,9],[11,5,8],[14,6,12],[4,3,10],[3,13,15],[15,12,13],[1,7,16],[17,4,16],[11,12,9],[7,2,9],[17,9,14],[8,13,10]])S.c[idx(x,y)]={t:'scrap',v,r:.5};for(const[x,y]of [[2,5],[2,6],[3,5],[14,2],[14,3],[16,6],[16,7],[5,12],[6,12],[12,2]])S.c[idx(x,y)].t='rock';put(9,8,'hq');put(7,8,'generator');put(5,5,'drill');put(7,5,'factory');put(9,5,'turret').ammo=8;run=false;sel=null;shots=[];flowClock=pathClock=saveClock=0;reveal();updatePower();repath();setMode('move');say('在黃色虛線格建造輸送帶，完成初始生產線。');$('#result').hidden=true;ui();draw()}
function updatePower(){let supply=0,demand=0;for(const b of S.b)if(b){if(b.t==='generator')supply+=8;demand+=spec[b.t][3]}power={supply,demand,ratio:demand?Math.min(1,supply/demand):1}}

function inspect(x,y){let b=at(x,y),c=S.c[idx(x,y)];detail(b?`${spec[b.t][0]}｜HP ${Math.ceil(b.hp)}/${spec[b.t][1]}`+(b.t==='turret'?`｜彈藥 ${b.ammo}/24`:(b.t==='factory'?`｜礦石 ${b.input}｜輸出 ${b.out}`:b.t==='drill'?`｜輸出 ${b.out}`:b.t==='belt'?`｜${b.item==='ore'?'礦石':b.item==='ammo'?'彈藥':'空閒'}`:''))+( ['belt','drill','factory'].includes(b.t)?`｜方向 ${A[b.d]}`:''):c.t==='scrap'?`廢墟：${c.v} 廢料`:c.t==='ore'?'鐵礦：可建採礦機':c.t==='rock'?'岩石：不可通行':'空地')}
function action(x,y){if(S.dead)return;sel=[x,y];let b=at(x,y),c=S.c[idx(x,y)];if(mode==='move'){move(x,y);inspect(x,y);return}if(!S.seen[idx(x,y)])return say('先探索此區域。');if(mode==='repair'){if(!b||b.hp>=spec[b.t][1]||S.scrap<3)return say('無需修理或廢料不足。');S.scrap-=3;b.hp=Math.min(spec[b.t][1],b.hp+40)}else if(mode==='reload'){if(!b||b.t!=='turret')return say('選擇炮塔。');let n=Math.min(S.ammo,8,24-b.ammo);b.ammo+=n;S.ammo-=n;say(`補充 ${n} 發`)}else if(mode==='remove'){if(!b||b.t==='hq')return say('不可拆除。');S.scrap+=Math.floor(spec[b.t][2]/2);S.ammo+=b.ammo;S.b[idx(x,y)]=null}else if(b){if(b.t===mode&&['belt','drill','factory'].includes(mode))b.d=(b.d+1)%4;else return inspect(x,y)}else{if(c.t==='rock'||c.t==='scrap'||(c.t==='ore')!==(mode==='drill'))return say('地形不適合此建築。');if(S.scrap<spec[mode][2])return say('廢料不足。');if((mode!=='belt'&&near(x,y,S.p.x,S.p.y)<.7)||S.e.some(e=>near(x,y,e.x,e.y)<.7))return say('此格被佔用。');S.scrap-=spec[mode][2];put(x,y,mode,dir);say('已建造 '+spec[mode][0])}updatePower();repath();inspect(x,y);ui()}
function accept(x,y,item){let b=at(x,y);if(!b)return false;if(b.t==='belt'&&!b.item){b.item=item;return true}if(b.t==='factory'&&item==='ore'&&b.input<6){b.input++;return true}if(b.t==='turret'&&item==='ammo'&&b.ammo<24){b.ammo++;return true}if(b.t==='hq'){if(item==='ore')S.scrap++;else S.ammo++;return true}return false}
function output(b,item){let[dx,dy]=D[b.d];return accept(b.x+dx,b.y+dy,item)}function flow(){let l=S.b.filter(b=>b&&b.t==='belt'&&b.item).map(b=>[b,b.item]);if(Math.random()<.5)l.reverse();for(const[b,i]of l)if(b.item===i&&output(b,i))b.item=null;for(const b of S.b)if(b&&b.out>0&&['drill','factory'].includes(b.t)&&output(b,b.t==='drill'?'ore':'ammo'))b.out--}

function repath(){dist=Array(W*H).fill(Infinity);let q=[idx(9,8)],closed=new Set();dist[q[0]]=0;while(q.length){q.sort((a,b)=>dist[b]-dist[a]);let i=q.pop();if(closed.has(i))continue;closed.add(i);let[x,y]=xy(i);for(const[dx,dy]of D){let a=x+dx,b=y+dy;if(!inside(a,b)||S.c[idx(a,b)].t==='rock')continue;let j=idx(a,b),d=dist[i]+cost(x,y);if(d<dist[j]){dist[j]=d;q.push(j)}}}}
function spawn(){let side=Math.random()<.55?S.side:Math.floor(Math.random()*4),x=side===1?W-1:side===3?0:Math.floor(Math.random()*W),y=side===0?0:side===2?H-1:Math.floor(Math.random()*H),fast=Math.random()<.17,heavy=S.day>=3&&!fast&&Math.random()<.2,hp=heavy?10+S.day:fast?3+Math.floor(S.day/3):5+Math.floor(S.day/2);S.e.push({x,y,tx:x,ty:y,hp,max:hp,fast,heavy,cool:0})}

let p=S.p;if(p.path.length){let[x,y]=p.path[0],d=near(p.x,p.y,x,y);if(!walk(x,y))p.path=[];else if(d<=dt*3.7){p.x=x;p.y=y;p.path.shift();let c=S.c[idx(x,y)];if(c.t==='scrap'){S.scrap+=c.v;c.t='ground';say('搜刮：+'+c.v+' 廢料')}}else{p.x+=(x-p.x)/d*dt*3.7;p.y+=(y-p.y)/d*dt*3.7}}reveal();if(near(p.x,p.y,9,8)<1.5)p.hp=Math.min(100,p.hp+dt*3);p.cool-=dt;if(p.cool<=0){let ranged=S.gun&&S.ammo>0,e=target(p.x,p.y,ranged?3.1:1.05);if(e){if(ranged)S.ammo--;fire(p.x,p.y,e,ranged?2:1,'#a4edac');p.cool=ranged?.55:.7}}for(const e of S.e){if(e.hp<=0||S.dead)continue;e.cool-=dt;if(near(e.x,e.y,p.x,p.y)<.8&&e.cool<=0){p.hp=Math.max(0,p.hp-(e.heavy?13:7));e.cool=.85;if(!p.hp)end('玩家倒下');continue}let d=near(e.x,e.y,e.tx,e.ty);if(d<.04){e.x=e.tx;e.y=e.ty;let best=Infinity,next=null;for(const[dx,dy]of D){let x=e.tx+dx,y=e.ty+dy;if(!inside(x,y)||S.c[idx(x,y)].t==='rock')continue;let v=dist[idx(x,y)]+cost(x,y);if(v<best){best=v;next=[x,y]}}if(!next)continue;let b=at(...next);if(b&&b.t!=='belt'){if(e.cool<=0){hit(b,e.heavy?15:7+Math.floor(S.day/2));e.cool=.85}continue}[e.tx,e.ty]=next;d=1}let v=Math.min(d,dt*((e.fast?1.55:e.heavy?.65:.95)+Math.min(.25,S.day*.025)));if(d){e.x+=(e.tx-e.x)/d*v;e.y+=(e.ty-e.y)/d*v}}

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function ln(x,y,a,b,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}function txt(s,x,y,c='#dfe9df',n=11){ctx.font=`bold ${n}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=c;ctx.fillText(s,x,y)}
