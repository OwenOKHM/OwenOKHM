<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a20"><title>禁區撤離 | Game Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10191f;color:#e9eee7;font:15px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}main{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:start}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(20px,4vw,34px);margin:0;letter-spacing:2px}small,.muted{color:#99adaa}.eyebrow{font-size:10px;letter-spacing:2px;color:#a8d9ab}button{font:inherit;font-weight:650;color:#e9eee7;background:#26383e;border:1px solid #4a6062;border-radius:9px;min-height:44px;padding:10px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}button:disabled{opacity:.35;cursor:default}button.primary{background:#b9e1a3;color:#152519;border-color:#b9e1a3}button.warn{background:#5b3432;border-color:#a96a5b}.panel{background:#1a292e;border:1px solid #354b4e;border-radius:13px;padding:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}.stat{background:#26373c;border-radius:8px;text-align:center;padding:7px 2px;min-width:0}.stat small{display:block;font-size:10px}.stat b{font-size:17px;white-space:nowrap}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;aspect-ratio:1;max-width:650px;margin:auto;touch-action:manipulation}.tile{position:relative;display:grid;place-items:center;aspect-ratio:1;min-height:0;padding:0;border-radius:5px;border:1px solid #354743;background:#2c3b35;font-size:clamp(17px,4.3vw,34px);line-height:1;overflow:hidden}.tile:nth-child(3n){background:#303f37}.tile.wall{background:repeating-linear-gradient(145deg,#414e4d,#414e4d 5px,#394544 5px,#394544 10px);border-color:#596666}.tile.exit{background:#254f43;border:2px solid #75c8a6}.tile.reach{box-shadow:inset 0 0 0 2px #80c794;background:#355746}.tile.target{box-shadow:inset 0 0 0 2px #e08c73;background:#553b34}.tile.player{background:#487767;box-shadow:inset 0 0 0 2px #c3f0c6}.tile.loot{background:#635637}.tile.enemy{background:#563932}.tile .number{position:absolute;bottom:2px;right:3px;font-size:10px;font-weight:800;color:#ffdc8e}.tile .enemyhp{position:absolute;top:3px;left:15%;width:70%;height:4px;background:#442c2c;border-radius:2px;overflow:hidden}.enemyhp i{display:block;background:#f19c85;height:100%}.log{min-height:48px;padding:10px;margin-top:8px;background:#23363b;border-radius:8px;line-height:1.45;font-size:13px;color:#cde2d6}.legend{font-size:11px;line-height:1.7;color:#b5c4bd;margin-top:8px}.side h2{font-size:17px;margin:0 0 8px}.side p{font-size:13px;line-height:1.5;color:#b2c4c0;margin:6px 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .wide{grid-column:1/-1}.line{height:1px;background:#3a4f50;margin:13px 0}.shop{display:grid;gap:7px}.shop button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:5px}.shop button small{font-size:11px}.overlay{position:fixed;inset:0;z-index:5;background:#0b141be8;display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none}.dialog{max-width:420px;width:100%;border:1px solid #66867a;border-radius:16px;background:#213339;padding:22px}.dialog h2{margin-top:0}.dialog p{color:#c2d4c8;line-height:1.5}.dialog button{width:100%;margin-top:8px}.chip{display:inline-block;border:1px solid #4e6b60;border-radius:20px;padding:5px 10px;color:#b8dfb3;font-size:12px}.statusrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.statusrow small{font-size:11px}.hpbar{height:4px;background:#432f2e;margin-top:5px;border-radius:2px;overflow:hidden}.hpbar i{display:block;background:#9fd99f;height:100%}a{color:#a8d9ab}
@media(max-width:720px){main{display:block;padding:8px}header{margin-bottom:8px}.panel{padding:8px}.side{margin-top:8px}.board{max-width:min(100%,65dvh)}.stats{margin-bottom:6px}.tile{font-size:clamp(16px,5.2vw,33px)}.side .actions{grid-template-columns:repeat(4,1fr)}.side .actions .wide{grid-column:auto}.side .actions button{font-size:12px;padding:5px}.shop{grid-template-columns:repeat(3,1fr)}.shop button{display:block;text-align:center;font-size:12px;padding:5px}}
@media(orientation:landscape) and (min-width:721px){main{max-width:calc(100dvh + 350px)}.board{max-width:min(100%,calc(100dvh - 180px))}}
</style></head><body><main>
<header><div><div class="eyebrow">GAME LAB / TACTICAL SURVIVAL</div><h1>禁區撤離</h1><small>每一步都係選擇，帶住戰利品返屋企。</small></div><span class="chip" id="raid">安全區 · 1</span></header>
<section class="panel"><div class="stats"><div class="stat"><small>生命</small><b id="hp">8/8</b><div class="hpbar"><i id="hpbar" style="width:100%"></i></div></div><div class="stat"><small>彈藥</small><b id="ammo">8</b></div><div class="stat"><small>戰利品</small><b id="loot" style="color:#f5cd7e">0</b></div><div class="stat"><small>存款</small><b id="bank">0</b></div><div class="stat"><small>回合</small><b id="turn">0</b></div></div>
<div class="statusrow"><b id="objective">收集戰利品，返回出口。</b><small id="danger"></small></div><div id="board" class="board" aria-label="戰術地圖"></div><div class="log" id="log" aria-live="polite">點擊綠框格移動，踩上箱子即可搜刮。</div><div class="legend">🟢 你　🚪 出口　📦 戰利品　🧟 敵人　🧱 牆壁　｜綠框：可移動　紅框：可射擊</div></section>
<aside class="panel side"><h2>行動</h2><p>沒有倒數計時。每次移動、射擊或治療後，敵人先會行動。可以避戰，唔需要清場。</p><div class="actions"><button id="heal">🩹 治療</button><button id="sneak">👣 正常移動</button><button id="wait">⏭ 等待一回合</button><button id="extract" class="primary">🚪 撤離</button></div><div class="line"></div><h2>藏身處</h2><p id="shopnote">成功撤離後，先可以用存款購買永久升級。</p><div class="shop"><button id="vest"><span>🛡 護甲</span><small id="vestprice">60</small></button><button id="mag"><span>🔫 彈藥袋</span><small id="magprice">50</small></button><button id="med"><span>🩹 醫療包</span><small id="medprice">45</small></button></div><div class="line"></div><div class="actions"><button id="normal" class="primary wide">進入普通禁區</button><button id="hard" class="wide warn">進入高危禁區 · 高回報</button></div><p id="record">成功撤離 0 次｜最佳收益 0</p><button id="reset" style="font-size:12px;width:100%">重置存檔</button><p>自動存檔 · 不需登入<br><a href="../lastline/">返回《末日工廠》</a></p></aside>
</main><div id="over" class="overlay" hidden><div class="dialog"><div class="eyebrow">MISSION REPORT</div><h2 id="overTitle"></h2><p id="overText"></p><button id="continue" class="primary">返回藏身處</button></div></div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),N=9,EXIT=76,D=[[0,-1],[1,0],[0,1],[-1,0]],KEY="raid-game-v1";
let meta={bank:0,vest:0,mag:0,med:0,success:0,best:0,attempt:0},s=null,notice="",overlay=false;
const xy=i=>[i%N,Math.floor(i/N)],dist=(a,b)=>{let [x,y]=xy(a),[u,v]=xy(b);return Math.abs(x-u)+Math.abs(y-v)},neigh=i=>{let[x,y]=xy(i);return D.map(([a,b])=>[x+a,y+b]).filter(([a,b])=>a>=0&&a<N&&b>=0&&b<N).map(([a,b])=>b*N+a)},rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){try{localStorage.setItem(KEY,JSON.stringify({meta,s,notice}))}catch(e){}}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.meta&&v.s&&Array.isArray(v.s.walls)&&v.s.walls.length===81&&Array.isArray(v.s.enemies)&&v.s.p>=0&&v.s.p<81){meta=v.meta;s=v.s;notice=v.notice||"已讀取存檔。";return true}}catch(e){}return false}
const cost=k=>({vest:60,mag:50,med:45}[k])*(1+meta[k]);
function say(t){notice=t}
function flood(w,start,blocked=new Set()){let q=[start],ds=new Map([[start,0]]);for(let k=0;k<q.length;k++){let i=q[k];for(let j of neigh(i))if(!w[j]&&!blocked.has(j)&&!ds.has(j)){ds.set(j,ds.get(i)+1);q.push(j)}}return ds}
function newRaid(hard=false){meta.attempt++;let w=Array(81).fill(false),all=shuffle(Array.from({length:81},(_,i)=>i).filter(i=>dist(i,EXIT)>2));for(let i of all){if(w.filter(Boolean).length>=(hard?19:14))break;w[i]=true;if(flood(w,EXIT).size!==81-w.filter(Boolean).length)w[i]=false}
let open=shuffle(all.filter(i=>!w[i]));let loot={};let lv=hard?[50,45,35,30,25,20,15]:[30,25,20,15,15,10,10];for(let v of lv){let i=open.pop();loot[i]={kind:"cash",value:v}}
for(let kind of ["ammo","ammo","med"]){let i=open.pop();loot[i]={kind,value:kind==="ammo"?3:1}}
let candidates=open.filter(i=>dist(i,EXIT)>=4);let enemies=[];for(let n=0;n<(hard?7:4);n++){let i=candidates.pop();if(i===undefined)break;let heavy=hard&&n<2;enemies.push({p:i,hp:heavy?3:2,max:heavy?3:2,heavy,alert:0})}
s={p:EXIT,walls:w,loot,enemies,hp:8+meta.vest*2,maxhp:8+meta.vest*2,ammo:8+meta.mag*3,med:2+meta.med,cash:0,turn:0,sneak:false,hard,active:true};overlay=false;$("over").hidden=true;say("點擊綠框格移動；踩上箱子搜刮。紅框敵人可以直接射擊。");save();render()}
function enemyAt(i){return s.enemies.find(e=>e.p===i)}
function los(a,b){let[x,y]=xy(a),[x2,y2]=xy(b),dx=Math.abs(x2-x),dy=-Math.abs(y2-y),sx=x<x2?1:-1,sy=y<y2?1:-1,err=dx+dy;for(let n=0;n<20;n++){if(x===x2&&y===y2)return true;let e=2*err;if(e>=dy){err+=dy;x+=sx}if(e<=dx){err+=dx;y+=sy}if(x===x2&&y===y2)return true;if(s.walls[y*N+x])return false}return false}
function reach(){let block=new Set(s.enemies.map(e=>e.p)),m=flood(s.walls,s.p,block),r=new Map();for(let [i,d] of m)if(d>0&&d<=(s.sneak?1:2))r.set(i,d);return r}
function pathTo(goal){let q=[s.p],prev=new Map([[s.p,-1]]);for(let k=0;k<q.length;k++){let i=q[k];if(i===goal)break;for(let j of neigh(i))if(!s.walls[j]&&!enemyAt(j)&&!prev.has(j)){prev.set(j,i);q.push(j)}}if(!prev.has(goal))return [];let p=[];for(let i=goal;i!==s.p;i=prev.get(i))p.unshift(i);return p}
function canShoot(e){return s.ammo>0&&dist(s.p,e.p)<=4&&los(s.p,e.p)}
function collect(i,events){let item=s.loot[i];if(!item)return;delete s.loot[i];if(item.kind==="cash"){s.cash+=item.value;events.push("搜刮 +"+item.value+" 信用點")}else if(item.kind==="ammo"){s.ammo+=item.value;events.push("取得 "+item.value+" 發彈藥")}else{s.med++;events.push("取得醫療包")}}
function finish(ok){s.active=false;let amount=s.cash;if(ok){meta.bank+=amount;meta.success++;meta.best=Math.max(meta.best,amount);say("撤離成功！已存入 "+amount+" 信用點。")}else{say("行動失敗，本次戰利品全部遺失。")}save();render();overlay=true;$("overTitle").textContent=ok?"撤離成功！":"你倒下了";$("overText").textContent=ok?"帶回 "+amount+" 信用點，總存款 "+meta.bank+"。可以升級裝備或直接再出發。":"本次失去 "+amount+" 信用點戰利品；之前的存款及永久升級仍然保留。";$("over").hidden=false}
function advance(events,noise=0){s.turn++;let hurt=0;for(let e of s.enemies){let d=dist(e.p,s.p);if(d===1){hurt+=e.heavy?2:1;e.alert=3;continue}let detect=(d<=(s.sneak?2:4)&&los(e.p,s.p))||(noise&&d<=noise);if(detect)e.alert=3;else e.alert=Math.max(0,e.alert-1);let opts=neigh(e.p).filter(i=>!s.walls[i]&&i!==s.p&&!enemyAt(i));if(!opts.length)continue;if(e.alert){let blocked=new Set(s.enemies.filter(a=>a!==e).map(a=>a.p)),m=flood(s.walls,s.p,blocked);opts.sort((a,b)=>(m.get(a)??999)-(m.get(b)??999));if(m.has(opts[0]))e.p=opts[0]}else if(Math.random()<.35)e.p=opts[rnd(opts.length)]}
if(hurt){s.hp=Math.max(0,s.hp-hurt);events.push("敵人攻擊 −"+hurt+" 生命")}if(s.hp<=0){finish(false);return}say(events.length?events.join(" · "):"行動完成。留意敵人位置。");save();render()}
function clickTile(i){if(!s.active||overlay)return;let e=enemyAt(i);if(e){if(canShoot(e)){s.ammo--;e.hp-=2;let events=["開火 −1 彈藥"];if(e.hp<=0){s.enemies=s.enemies.filter(a=>a!==e);events.push("擊倒敵人")}else events.push("重傷敵人");advance(events,6)}else if(!s.ammo&&dist(s.p,i)===1){e.hp--;let ev=["近戰攻擊"];if(e.hp<=0){s.enemies=s.enemies.filter(a=>a!==e);ev.push("擊倒敵人")}advance(ev,2)}else{say("敵人距離太遠、被牆遮擋，或彈藥不足。");render()}return}
if(i===s.p){say(i===EXIT?"點擊「撤離」帶走戰利品。":"你目前站在此格。");render();return}
if(!reach().has(i)){say("請選擇綠框格。每回合最多移動 "+(s.sneak?1:2)+" 格。");render();return}let ev=[];for(let j of pathTo(i)){s.p=j;collect(j,ev)}advance(ev,s.sneak?0:2)}
function buy(k){if(s.active||meta[k]>=3||meta.bank<cost(k))return;meta.bank-=cost(k);meta[k]++;say("永久升級成功！下一局生效。");save();render()}
function render(){let r=s.active?reach():new Map();$("hp").textContent=s.hp+"/"+s.maxhp;$("hpbar").style.width=100*s.hp/s.maxhp+"%";$("ammo").textContent=s.ammo;$("loot").textContent=s.cash;$("bank").textContent=meta.bank;$("turn").textContent=s.turn;$("raid").textContent=(s.hard?"高危禁區":"普通禁區")+" · "+meta.attempt;$("objective").textContent=s.active?(s.p===EXIT?"你在出口：可隨時撤離":"搜刮戰利品，再返回出口"):"藏身處 · 選擇下一次行動";$("danger").textContent="敵人 "+s.enemies.length+" 隻";$("log").textContent=notice;
let b=$("board");b.replaceChildren();for(let i=0;i<81;i++){let t=document.createElement("button");t.className="tile";let e=enemyAt(i),item=s.loot[i],symbol="",label="空地";if(s.walls[i]){t.classList.add("wall");symbol="";label="牆壁"}else if(i===s.p){t.classList.add("player");symbol="🟢";label="玩家"}else if(e){t.classList.add("enemy");symbol=e.heavy?"👹":"🧟";label="敵人，生命 "+e.hp;if(s.active&&(canShoot(e)||(!s.ammo&&dist(s.p,i)===1)))t.classList.add("target")}else if(i===EXIT){t.classList.add("exit");symbol="🚪";label="撤離點"}else if(item){t.classList.add("loot");symbol=item.kind==="cash"?"📦":item.kind==="ammo"?"🔋":"🩹";label=item.kind==="cash"?"戰利品 "+item.value:item.kind==="ammo"?"彈藥":"醫療包"}if(r.has(i))t.classList.add("reach");t.textContent=symbol;if(item&&item.kind==="cash"&&i!==s.p&&!e){let n=document.createElement("span");n.className="number";n.textContent=item.value;t.append(n)}if(e){let hp=document.createElement("span");hp.className="enemyhp";let bar=document.createElement("i");bar.style.width=e.hp/e.max*100+"%";hp.append(bar);t.append(hp)}t.setAttribute("aria-label",label);t.onclick=()=>clickTile(i);b.append(t)}
$("heal").textContent="🩹 治療 ×"+s.med;$("heal").disabled=!s.active||s.med===0||s.hp===s.maxhp;$("sneak").textContent=s.sneak?"👣 潛行 ON":"👣 正常移動";$("sneak").classList.toggle("primary",s.sneak);$("sneak").disabled=!s.active;$("wait").disabled=!s.active;$("extract").disabled=!s.active||s.p!==EXIT;$("normal").disabled=s.active;$("hard").disabled=s.active;
for(let k of ["vest","mag","med"]){$(k).disabled=s.active||meta[k]>=3||meta.bank<cost(k);$(k+"price").textContent=meta[k]>=3?"MAX":"LV "+meta[k]+" → "+cost(k)}
$("shopnote").textContent=s.active?"撤離成功後可購買永久升級。":"護甲 +2 生命｜彈藥袋 +3 彈｜醫療包 +1 次。";$("record").textContent="成功撤離 "+meta.success+" 次｜最佳收益 "+meta.best}
$("heal").onclick=()=>{if(!s.active||s.med<=0||s.hp===s.maxhp)return;s.med--;let n=Math.min(4,s.maxhp-s.hp);s.hp+=n;advance(["治療 +"+n+" 生命"])};$("sneak").onclick=()=>{if(!s.active)return;s.sneak=!s.sneak;say(s.sneak?"潛行：每回合移動 1 格，較難被發現。":"正常：每回合移動最多 2 格。");save();render()};$("wait").onclick=()=>{if(s.active)advance(["等待一回合"])};$("extract").onclick=()=>{if(s.active&&s.p===EXIT)finish(true)};
$("normal").onclick=()=>{if(!s.active)newRaid(false)};$("hard").onclick=()=>{if(!s.active)newRaid(true)};for(let k of ["vest","mag","med"])$(k).onclick=()=>buy(k);$("continue").onclick=()=>{overlay=false;$("over").hidden=true;render()};$("reset").onclick=()=>{if(confirm("清除所有存款與升級，重新開始？")){try{localStorage.removeItem(KEY)}catch(e){}meta={bank:0,vest:0,mag:0,med:0,success:0,best:0,attempt:0};newRaid(false)}};
if(load()){render()}else newRaid(false);
})();
</script></body></html>
